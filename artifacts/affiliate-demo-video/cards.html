<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box } body { margin: 0; background: #061526; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 1920px; height: 1080px; overflow: hidden }
  .card { width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 72% 28%, #123760 0, #061526 42%, #040e1a 100%) }
  .brand { color: #50d5d1; letter-spacing: .24em; font-size: 34px; font-weight: 700; margin-bottom: 62px }
  h1 { font-size: 76px; line-height: 1.08; margin: 0; letter-spacing: -.04em }
  .sub { color: #b5c4d4; font-size: 35px; margin-top: 34px }
  .offer h1 { font-size: 60px; margin-bottom: 80px }
  .plans { display: flex; gap: 48px }
  .plan { width: 650px; padding: 42px 48px; border: 1px solid #274664; border-radius: 22px; background: rgba(7,25,43,.72) }
  .label { color: #b5c4d4; font-size: 30px; min-height: 45px }
  .price { font-size: 70px; font-weight: 750; margin-top: 18px; letter-spacing: -.03em }
  .cta { color: #50d5d1; font-size: 42px; font-weight: 650; margin-top: 74px }
</style>
<div class="card intro" id="intro">
  <div class="brand">RESELLGRID</div>
  <h1>Launch your own VTU business</h1>
  <div class="sub">One platform. Multiple income channels.</div>
</div>
<div class="card offer" id="outro">
  <h1>Choose how you want to launch</h1>
  <div class="plans">
    <div class="plan"><div class="label">Affiliate website</div><div class="price">₦50,000</div></div>
    <div class="plan"><div class="label">Parent platform + 2 affiliate slots</div><div class="price">₦150,000</div></div>
  </div>
  <div class="cta">Message us on WhatsApp to get started</div>
</div>
