name: Validate main for Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: namecheap-main-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run platform-admin tests
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan test tests/Feature/PlatformAdmin/AuthenticationTest.php
